<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1180" role="img" aria-label="サクタンの単語学習画面">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#effbf8"/>
      <stop offset="1" stop-color="#dff5ef"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#0a243f" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="760" height="1180" rx="86" fill="#0e1828"/>
  <rect x="34" y="34" width="692" height="1112" rx="64" fill="url(#bg)"/>
