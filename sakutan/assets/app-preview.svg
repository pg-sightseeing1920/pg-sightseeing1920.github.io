  <rect x="124" y="516" width="88" height="56" rx="28" fill="#e8f7f3" stroke="#d7ece7" stroke-width="3"/>
  <text x="168" y="554" font-family="Arial, 'Hiragino Sans', sans-serif" font-size="25" font-weight="800" fill="#1fc0a0" text-anchor="middle">高1</text>
  <text x="607" y="554" font-family="Arial, 'Hiragino Sans', sans-serif" font-size="25" font-weight="800" fill="#748299" text-anchor="end">タップで答え</text>
  <text x="380" y="686" font-family="Arial, sans-serif" font-size="92" font-weight="900" fill="#111d35" text-anchor="middle">fortunate</text>
